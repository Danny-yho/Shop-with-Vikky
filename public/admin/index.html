<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Shop with Vikky</title><meta name="theme-color" content="#3B0B73"><link rel="icon" href="/images/logo-icon.svg"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>try{document.documentElement.dataset.theme=localStorage.getItem('swv_admin_theme')==='dark'?'dark':'light'}catch(e){}</script><link rel="stylesheet" href="/css/styles.css"></head>
<body class="marble-page">
<button class="theme-toggle admin-theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode"><svg class="theme-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.2 15.4A8.4 8.4 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="theme-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="visually-hidden">Toggle dark mode</span></button>
<main id="loginView" class="section"><div class="container-main" style="max-width:480px"><div class="glass p-4"><img src="/images/logo-full.png" alt="Shop with Vikky" style="height:70px"><h1 class="h4 mt-3">Admin login</h1><form id="loginForm" class="mt-3"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-glossy w-100">Sign in</button></form><div id="loginError" class="text-danger mt-3"></div></div></div></main>
<main id="adminView" class="admin-shell d-none"><aside class="admin-sidebar"><img src="/images/logo-full.png" alt="" style="height:52px;width:100%;object-fit:contain"><nav class="mt-4"><a href="#" data-tab="dashboard">Dashboard</a><a href="#" data-tab="products">Products</a><a href="#" data-tab="categories">Categories</a><a href="#" data-tab="orders">Orders</a><a href="#" data-tab="messages">Customers & Messages</a><a href="#" data-tab="settings">Settings</a><a href="#" id="logout">Logout</a></nav></aside><section class="admin-main"><div id="adminContent"></div></section></main>
<div id="productModal" class="admin-modal" hidden>
<div class="admin-modal-backdrop" data-modal-close></div>
<div class="admin-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
<div class="admin-modal-header"><h2 id="productModalTitle" class="h5 mb-0">Edit product</h2><button class="admin-modal-close" type="button" data-modal-close aria-label="Close">&times;</button></div>
<div id="productModalBody" class="admin-modal-body"></div>
</div>
</div>
<script src="/js/config.js"></script>
<script>
const themeKey='swv_admin_theme';
function setTheme(theme){document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-theme-toggle]').forEach(button=>{button.setAttribute('aria-pressed',String(theme==='dark'));button.setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode');button.title=theme==='dark'?'Switch to light mode':'Switch to dark mode'})}
function applyTheme(theme){localStorage.setItem(themeKey,theme);setTheme(theme)}
function toggleTheme(button){const nextTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(!document.startViewTransition||reduceMotion){applyTheme(nextTheme);return}const rect=button.getBoundingClientRect();const x=rect.left+rect.width/2,y=rect.top+rect.height/2;const radius=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));const root=document.documentElement;root.style.setProperty('--x',`${x}px`);root.style.setProperty('--y',`${y}px`);root.style.setProperty('--r',`${radius}px`);root.classList.add('theme-transition');document.startViewTransition(()=>applyTheme(nextTheme)).finished.finally(()=>{root.classList.remove('theme-transition');root.style.removeProperty('--x');root.style.removeProperty('--y');root.style.removeProperty('--r')})}
setTheme(localStorage.getItem(themeKey)==='dark'?'dark':'light');
document.querySelectorAll('[data-theme-toggle]').forEach(button=>button.addEventListener('click',()=>toggleTheme(button)));
window.addEventListener('storage',event=>{if(event.key===themeKey)setTheme(event.newValue==='dark'?'dark':'light')});
let csrf='';
function mediaUrl(url){if(!url)return '';return /^https?:\/\//i.test(url)?url:url}
async function api(path,options={}){const headers={...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(csrf?{'x-csrf-token':csrf}:{})};const r=await fetch((window.API_BASE||'')+path,{credentials:'include',...options,headers:{...headers,...options.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function init(){try{const c=await api('/api/auth/csrf');csrf=c.csrfToken;await api('/api/auth/me');showAdmin()}catch{document.getElementById('loginView').classList.remove('d-none')}}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:fd.get('email'),password:fd.get('password')})});showAdmin()}catch(err){document.getElementById('loginError').textContent=err.message}};
async function showAdmin(){document.getElementById('loginView').classList.add('d-none');document.getElementById('adminView').classList.remove('d-none');dashboard()}
async function dashboard(){const [p,o]=await Promise.all([api('/api/admin/products'),api('/api/admin/orders')]);const orders=o.orders||[],pending=orders.filter(x=>x.status==='pending').length,revenue=orders.filter(x=>x.paymentStatus==='paid').reduce((n,x)=>n+x.total,0);document.getElementById('adminContent').innerHTML=`<h1 class="h3">Dashboard</h1><div class="row g-3 mt-2">${[[orders.length,'Orders'],[revenue,'Revenue'],[pending,'Pending'],[(p.products||[]).filter(x=>x.stock<=5).length,'Low stock']].map(x=>`<div class="col-md-3"><div class="glass p-3"><small>${x[1]}</small><h2>${typeof x[0]==='number'&&x[1]==='Revenue'?'₦'+x[0].toLocaleString('en-NG'):x[0]}</h2></div></div>`).join('')}</div>`}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function slugify(value){return String(value||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function productPayload(product){return{categoryId:product.category_id??null,name:product.name,slug:product.slug,description:product.description||'',price:product.price,compareAtPrice:product.compare_at_price??null,imageUrl:product.image_url||'',sizes:product.sizes||[],colors:product.colors||[],stock:product.stock,active:Boolean(product.active),featured:Boolean(product.featured),newArrival:Boolean(product.newArrival),bestSeller:Boolean(product.bestSeller)}}
const productModal=document.getElementById('productModal'),productModalBody=document.getElementById('productModalBody'),productModalTitle=document.getElementById('productModalTitle');
let modalReturnFocus=null,closeProductModal=()=>{};
function initProductModal(){
 closeProductModal=()=>{
  if(productModal.hidden)return;
  productModal.hidden=true;productModalBody.innerHTML='';document.body.classList.remove('admin-modal-open');
  if(modalReturnFocus&&document.contains(modalReturnFocus))modalReturnFocus.focus();
  modalReturnFocus=null;
 };
 productModal.addEventListener('click',event=>{if(event.target.closest('[data-modal-close]'))closeProductModal()});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!productModal.hidden)closeProductModal()});
}
initProductModal();
async function products(){
 const host=document.getElementById('adminContent');
 try{
  const [productData,categoryData]=await Promise.all([api('/api/admin/products'),api('/api/admin/categories')]);
  const allProducts=productData.products||[],categories=categoryData.categories||[];
  host.innerHTML=`<div class="d-flex flex-wrap justify-content-between align-items-center gap-3"><div><h1 class="h3 mb-1">Products</h1><p class="text-muted mb-0">Manage catalog details, visibility, and homepage placement.</p></div><button id="newProduct" class="btn btn-glossy" type="button">Add product</button></div><div class="glass p-3 mt-3"><div class="row g-3 align-items-end"><div class="col-md-8"><label class="form-label" for="productSearch">Search products</label><input id="productSearch" class="form-control" type="search" placeholder="Name, category, or slug"></div><div class="col-md-4"><label class="form-label" for="productStatusFilter">Show</label><select id="productStatusFilter" class="form-select"><option value="all">All products</option><option value="active">Active only</option><option value="inactive">Hidden only</option></select></div></div></div><div id="productNotice" class="mt-3" role="status" aria-live="polite"></div><div id="productTableHost"></div>`;
  const tableHost=document.getElementById('productTableHost'),notice=document.getElementById('productNotice');
  const renderTable=()=>{
   const query=document.getElementById('productSearch').value.trim().toLowerCase(),status=document.getElementById('productStatusFilter').value;
   const visible=allProducts.filter(product=>{
    const matchesText=`${product.name} ${product.slug} ${product.category||''}`.toLowerCase().includes(query);
    return matchesText&&(status==='all'||(status==='active')===Boolean(product.active));
   });
   tableHost.innerHTML=visible.length?`<div class="glass p-3 mt-3 table-responsive"><table class="table align-middle"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Homepage</th><th>Status</th><th>Actions</th></tr></thead><tbody>${visible.map(product=>`<tr><td><div class="d-flex align-items-center gap-2">${product.image_url?`<img src="${escapeHtml(mediaUrl(product.image_url))}" alt="" width="48" height="56" class="rounded object-fit-cover">`:''}<span>${escapeHtml(product.name)}</span></div></td><td>${escapeHtml(product.category||'Uncategorised')}</td><td>₦${Number(product.price).toLocaleString('en-NG')}</td><td>${product.stock}</td><td>${product.newArrival?'New arrival':product.bestSeller?'Best seller':product.featured?'Featured in shop':'Shop only'}</td><td><span class="badge ${product.active?'text-bg-success':'text-bg-secondary'}">${product.active?'Active':'Hidden'}</span></td><td><div class="d-flex flex-wrap gap-2"><button class="btn btn-sm btn-outline-brand" type="button" data-edit-product="${product.id}">Edit</button><button class="btn btn-sm btn-outline-brand" type="button" data-toggle-product="${product.id}">${product.active?'Hide':'Activate'}</button><button class="btn btn-sm btn-outline-danger" type="button" data-delete-product="${product.id}">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="glass p-4 mt-3 text-center">No products match this filter.</div>';
  };
  const openForm=(product=null)=>{
   const editing=Boolean(product),currentImage=product?.image_url||'';
   modalReturnFocus=document.activeElement;
   productModalTitle.textContent=editing?'Edit product':'Add product';
   productModalBody.innerHTML=`<form id="productForm"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="productName">Product name</label><input id="productName" class="form-control" required maxlength="160" value="${escapeHtml(product?.name||'')}"></div><div class="col-md-6"><label class="form-label" for="productSlug">Product URL slug</label><input id="productSlug" class="form-control" required maxlength="100" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" value="${escapeHtml(product?.slug||'')}"><div class="form-text">Lowercase letters, numbers, and hyphens only.</div></div><div class="col-md-6"><label class="form-label" for="productCategory">Category</label><select id="productCategory" class="form-select"><option value="">Uncategorised</option>${categories.map(category=>`<option value="${category.id}" ${String(product?.category_id??'')===String(category.id)?'selected':''}>${escapeHtml(category.name)}</option>`).join('')}</select></div><div class="col-md-3"><label class="form-label" for="productPrice">Price (₦)</label><input id="productPrice" class="form-control" type="number" min="0" step="1" required value="${product?.price??''}"></div><div class="col-md-3"><label class="form-label" for="productComparePrice">Previous price (optional)</label><input id="productComparePrice" class="form-control" type="number" min="0" step="1" value="${product?.compare_at_price??''}"></div><div class="col-12"><label class="form-label" for="productDescription">Description</label><textarea id="productDescription" class="form-control" rows="3" maxlength="5000">${escapeHtml(product?.description||'')}</textarea></div><div class="col-md-6"><label class="form-label" for="productImageUrl">Image URL</label><input id="productImageUrl" class="form-control" maxlength="1000" value="${escapeHtml(currentImage)}" placeholder="/uploads/image.jpg or https://..."></div><div class="col-md-6"><label class="form-label" for="productImageFile">Or upload an image</label><input id="productImageFile" class="form-control" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="form-text">JPEG, PNG, WebP, or GIF; maximum size follows the server upload limit.</div></div><div class="col-12 d-flex align-items-center gap-3">${currentImage?`<img id="productImagePreview" src="${escapeHtml(currentImage)}" alt="Product image preview" width="72" height="88" class="rounded object-fit-cover">`:'<img id="productImagePreview" alt="Product image preview" width="72" height="88" class="rounded object-fit-cover d-none">'}<span id="imageUploadStatus" class="small" role="status"></span></div><div class="col-md-6"><label class="form-label" for="productSizes">Sizes</label><input id="productSizes" class="form-control" value="${escapeHtml(product?.sizes?.join(', ')||'')}" placeholder="XS, S, M, L"></div><div class="col-md-6"><label class="form-label" for="productColors">Colors</label><input id="productColors" class="form-control" value="${escapeHtml(product?.colors?.join(', ')||'')}" placeholder="Purple, Black"></div><div class="col-md-3"><label class="form-label" for="productStock">Stock</label><input id="productStock" class="form-control" type="number" min="0" step="1" required value="${product?.stock??0}"></div><div class="col-12"><fieldset><legend class="h6">Visibility and placement</legend><div class="d-flex flex-wrap gap-3"><label><input id="productActive" type="checkbox" ${product?.active!==false?'checked':''}> Visible in shop</label><label><input id="productFeatured" type="checkbox" ${product?.featured?'checked':''}> Featured in shop sorting</label><label><input id="productNewArrival" type="checkbox" ${product?.newArrival?'checked':''}> Show as a new arrival</label><label><input id="productBestSeller" type="checkbox" ${product?.bestSeller?'checked':''}> Mark as a best seller</label></div><div class="form-text">Homepage shows up to four new arrivals and four best sellers. New arrivals are not repeated in the best-sellers section.</div></fieldset></div></div><p id="productFormError" class="text-danger mt-3 mb-0" role="alert"></p><div class="d-flex flex-wrap gap-2 mt-3"><button id="saveProduct" class="btn btn-glossy" type="submit">${editing?'Save changes':'Create product'}</button><button id="cancelProduct" class="btn btn-outline-brand" type="button">Cancel</button></div></form>`;
   document.body.classList.add('admin-modal-open');productModal.hidden=false;
   const form=document.getElementById('productForm'),nameInput=document.getElementById('productName'),slugInput=document.getElementById('productSlug'),imageInput=document.getElementById('productImageUrl'),fileInput=document.getElementById('productImageFile'),preview=document.getElementById('productImagePreview'),uploadStatus=document.getElementById('imageUploadStatus'),errorHost=document.getElementById('productFormError');
   if(!editing)nameInput.addEventListener('input',()=>{slugInput.value=slugify(nameInput.value)});
   imageInput.addEventListener('input',()=>{preview.src=imageInput.value;preview.classList.toggle('d-none',!imageInput.value)});
   document.getElementById('cancelProduct').addEventListener('click',closeProductModal);
   fileInput.addEventListener('change',async()=>{
    const file=fileInput.files[0];if(!file)return;
    const data=new FormData();data.append('image',file);uploadStatus.textContent='Uploading image…';
    try{const result=await api('/api/admin/uploads',{method:'POST',body:data});imageInput.value=result.url;preview.src=result.url;preview.classList.remove('d-none');uploadStatus.textContent='Image uploaded.'}
    catch(error){uploadStatus.textContent=error.message}
   });
   form.addEventListener('submit',async event=>{
    event.preventDefault();errorHost.textContent='';
    const splitList=value=>value.split(',').map(item=>item.trim()).filter(Boolean);
    const payload={categoryId:document.getElementById('productCategory').value?Number(document.getElementById('productCategory').value):null,name:nameInput.value.trim(),slug:slugInput.value.trim(),description:document.getElementById('productDescription').value.trim(),price:Number(document.getElementById('productPrice').value),compareAtPrice:document.getElementById('productComparePrice').value===''?null:Number(document.getElementById('productComparePrice').value),imageUrl:imageInput.value.trim(),sizes:splitList(document.getElementById('productSizes').value),colors:splitList(document.getElementById('productColors').value),stock:Number(document.getElementById('productStock').value),active:document.getElementById('productActive').checked,featured:document.getElementById('productFeatured').checked,newArrival:document.getElementById('productNewArrival').checked,bestSeller:document.getElementById('productBestSeller').checked};
    const saveButton=document.getElementById('saveProduct');saveButton.disabled=true;saveButton.textContent='Saving…';
    try{await api(editing?`/api/admin/products/${product.id}`:'/api/admin/products',{method:editing?'PUT':'POST',body:JSON.stringify(payload)});closeProductModal();await products()}
    catch(error){errorHost.textContent=error.message;saveButton.disabled=false;saveButton.textContent=editing?'Save changes':'Create product'}
   });
   nameInput.focus();
  };
  document.getElementById('newProduct').addEventListener('click',()=>openForm());
  document.getElementById('productSearch').addEventListener('input',renderTable);
  document.getElementById('productStatusFilter').addEventListener('change',renderTable);
  tableHost.addEventListener('click',async event=>{
   const button=event.target.closest('button');if(!button)return;
   const product=allProducts.find(item=>item.id===Number(button.dataset.editProduct||button.dataset.toggleProduct||button.dataset.deleteProduct));if(!product)return;
   if(button.hasAttribute('data-edit-product')){openForm(product);return}
   if(button.hasAttribute('data-toggle-product')){
    const originalActive=product.active;
    product.active=!product.active;
    renderTable();
    const rowToggle=tableHost.querySelector(`[data-toggle-product="${product.id}"]`);
    if(rowToggle){rowToggle.disabled=true;rowToggle.textContent='Updating…'}
    try{
     await api(`/api/admin/products/${product.id}`,{method:'PUT',body:JSON.stringify({...productPayload(product),active:product.active})});
     notice.textContent='';notice.className='mt-3';
     if(rowToggle){rowToggle.disabled=false;rowToggle.textContent=product.active?'Hide':'Activate'}
    }catch(error){
     product.active=originalActive;
     renderTable();
     notice.textContent=error.message;notice.className='text-danger mt-3'
    }
    return;
   }
   if(button.hasAttribute('data-delete-product')){
    if(!confirm(`Permanently delete "${product.name}"? This cannot be undone. To temporarily remove it from the shop, choose Hide instead.`))return;
    button.disabled=true;button.textContent='Deleting…';
    try{
     await api(`/api/admin/products/${product.id}`,{method:'DELETE'});
     const index=allProducts.indexOf(product);if(index>-1)allProducts.splice(index,1);
     renderTable();
     notice.textContent='';notice.className='mt-3';
    }catch(error){
     button.disabled=false;button.textContent='Delete';
     notice.textContent=error.message;notice.className='text-danger mt-3'
    }
   }
  });
  renderTable();
 }catch(error){host.innerHTML=`<h1 class="h3">Products</h1><div class="alert alert-danger mt-3" role="alert">${escapeHtml(error.message)}</div>`}
}
async function manageCategories(){
 const host=document.getElementById('adminContent');
 try{
  const data=await api('/api/admin/categories');
  const list=data.categories||[];
  const byId=Object.fromEntries(list.map(category=>[category.id,category]));
  const categoryCard=category=>`<div class="col-md-6" data-category-card="${category.id}"><div class="glass p-3 h-100 d-flex flex-column gap-2"><div class="d-flex align-items-center gap-3"><img class="admin-category-thumb rounded" data-category-preview="${category.id}" src="${escapeHtml(mediaUrl(category.image_url)||'/images/product-placeholder.svg')}" alt=""><div><h2 class="h6 mb-0" data-category-title="${category.id}">${escapeHtml(category.name)}</h2><small class="text-muted">${escapeHtml(category.slug)}</small></div></div><label class="form-label small mb-0" for="categoryName${category.id}">Name</label><input id="categoryName${category.id}" class="form-control form-control-sm" maxlength="100" data-category-name="${category.id}" value="${escapeHtml(category.name)}"><label class="form-label small mb-0" for="categoryDescription${category.id}">Description</label><textarea id="categoryDescription${category.id}" class="form-control form-control-sm" rows="2" maxlength="1000" data-category-description="${category.id}">${escapeHtml(category.description||'')}</textarea><label class="form-label small mb-0" for="categoryUrl${category.id}">Image URL</label><input id="categoryUrl${category.id}" class="form-control form-control-sm" data-category-url="${category.id}" value="${escapeHtml(category.image_url||'')}" placeholder="/images/... or https://..."><label class="form-label small mb-0" for="categoryFile${category.id}">Or upload a new image</label><input id="categoryFile${category.id}" class="form-control form-control-sm" type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-category-file="${category.id}"><div class="d-flex flex-wrap align-items-center gap-2"><button class="btn btn-sm btn-glossy" type="button" data-category-save="${category.id}">Save</button><button class="btn btn-sm btn-outline-danger" type="button" data-category-delete="${category.id}">Delete</button><span class="small" role="status" data-category-status="${category.id}"></span></div></div></div>`;
  host.innerHTML=`<div class="d-flex flex-wrap justify-content-between align-items-center gap-3"><div><h1 class="h3 mb-1">Categories</h1><p class="text-muted mb-0">Add categories and update the image and text shown in the homepage "Shop by category" section.</p></div><button id="newCategory" class="btn btn-glossy" type="button">Add category</button></div><div id="categoryCreate" class="glass p-3 mt-3 d-none"><h2 class="h6">New category</h2><div class="row g-3 mt-0"><div class="col-md-6"><label class="form-label" for="newCategoryName">Name</label><input id="newCategoryName" class="form-control" maxlength="100" placeholder="e.g. Perfumes"></div><div class="col-md-6"><label class="form-label" for="newCategorySlug">Slug</label><input id="newCategorySlug" class="form-control" maxlength="100" placeholder="perfumes"><div class="form-text">Auto-filled from the name.</div></div><div class="col-12"><label class="form-label" for="newCategoryDescription">Description</label><textarea id="newCategoryDescription" class="form-control" rows="2" maxlength="1000"></textarea></div><div class="col-md-6"><label class="form-label" for="newCategoryImageUrl">Image URL</label><input id="newCategoryImageUrl" class="form-control" maxlength="1000" placeholder="/images/... or https://..."></div><div class="col-md-6"><label class="form-label" for="newCategoryImageFile">Or upload an image</label><input id="newCategoryImageFile" class="form-control" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><div class="col-12 d-flex flex-wrap align-items-center gap-3"><img id="newCategoryPreview" class="admin-category-thumb rounded d-none" alt=""><button id="saveCategory" class="btn btn-glossy" type="button">Create category</button><button id="cancelCategory" class="btn btn-outline-brand" type="button">Cancel</button><span id="categoryCreateStatus" class="small" role="status"></span></div></div></div><div id="categoryNotice" class="mt-3" role="status" aria-live="polite"></div><div id="categoryHost" class="row g-3 mt-1">${list.map(categoryCard).join('')||'<div class="col-12"><div class="glass p-4 text-center">No categories yet. Use "Add category" to create one.</div></div>'}</div>`;
  const notice=document.getElementById('categoryNotice'),listHost=document.getElementById('categoryHost'),createHost=document.getElementById('categoryCreate');
  const showNotice=(message,isError)=>{notice.textContent=message;notice.className=isError?'text-danger mt-3':'mt-3'};
  document.getElementById('newCategory').addEventListener('click',()=>{createHost.classList.toggle('d-none');if(!createHost.classList.contains('d-none'))document.getElementById('newCategoryName').focus()});
  document.getElementById('cancelCategory').addEventListener('click',()=>{createHost.classList.add('d-none');document.getElementById('categoryCreateStatus').textContent=''});
  document.getElementById('newCategoryName').addEventListener('input',()=>{document.getElementById('newCategorySlug').value=slugify(document.getElementById('newCategoryName').value)});
  document.getElementById('newCategoryImageUrl').addEventListener('input',()=>{const preview=document.getElementById('newCategoryPreview'),value=document.getElementById('newCategoryImageUrl').value.trim();preview.src=value||'/images/product-placeholder.svg';preview.classList.toggle('d-none',!value)});
  document.getElementById('newCategoryImageFile').addEventListener('change',async event=>{
   const file=event.target.files[0];if(!file)return;
   const status=document.getElementById('categoryCreateStatus');status.textContent='Uploading…';
   const form=new FormData();form.append('image',file);
   try{const result=await api('/api/admin/uploads',{method:'POST',body:form});document.getElementById('newCategoryImageUrl').value=result.url;const preview=document.getElementById('newCategoryPreview');preview.src=result.url;preview.classList.remove('d-none');status.textContent='Image uploaded.'}
   catch(error){status.textContent=error.message}
  });
  document.getElementById('saveCategory').addEventListener('click',async event=>{
   const button=event.currentTarget,status=document.getElementById('categoryCreateStatus');
   const payload={name:document.getElementById('newCategoryName').value.trim(),slug:document.getElementById('newCategorySlug').value.trim(),description:document.getElementById('newCategoryDescription').value.trim(),imageUrl:document.getElementById('newCategoryImageUrl').value.trim()};
   if(!payload.name||!payload.slug){status.textContent='Name and slug are required.';return}
   button.disabled=true;const label=button.textContent;button.textContent='Creating…';status.textContent='';
   try{await api('/api/admin/categories',{method:'POST',body:JSON.stringify(payload)});await manageCategories()}
   catch(error){status.textContent=error.message;button.disabled=false;button.textContent=label}
  });
  listHost.addEventListener('input',event=>{const urlInput=event.target.closest('[data-category-url]');if(urlInput){const preview=listHost.querySelector(`[data-category-preview="${urlInput.dataset.categoryUrl}"]`);if(preview)preview.src=urlInput.value.trim()||'/images/product-placeholder.svg'}});
  listHost.addEventListener('change',async event=>{
   const fileInput=event.target.closest('[data-category-file]');if(!fileInput)return;
   const id=Number(fileInput.dataset.categoryFile),file=fileInput.files[0];if(!file)return;
   const status=listHost.querySelector(`[data-category-status="${id}"]`),preview=listHost.querySelector(`[data-category-preview="${id}"]`),urlInput=listHost.querySelector(`[data-category-url="${id}"]`);
   status.textContent='Uploading…';const form=new FormData();form.append('image',file);
   try{const result=await api('/api/admin/uploads',{method:'POST',body:form});urlInput.value=result.url;preview.src=result.url;status.textContent='Uploaded — click "Save".'}
   catch(error){status.textContent='';showNotice(error.message,true)}
  });
  listHost.addEventListener('click',async event=>{
   const saveButton=event.target.closest('[data-category-save]');
   if(saveButton){
    const id=Number(saveButton.dataset.categorySave),category=byId[id];if(!category)return;
    const status=listHost.querySelector(`[data-category-status="${id}"]`);
    const payload={name:listHost.querySelector(`[data-category-name="${id}"]`).value.trim(),slug:category.slug,description:listHost.querySelector(`[data-category-description="${id}"]`).value.trim(),imageUrl:listHost.querySelector(`[data-category-url="${id}"]`).value.trim()};
    if(!payload.name){status.textContent='Name is required.';return}
    saveButton.disabled=true;const label=saveButton.textContent;saveButton.textContent='Saving…';status.textContent='';
    try{const result=await api(`/api/admin/categories/${id}`,{method:'PUT',body:JSON.stringify(payload)});byId[id]=result.category;const title=listHost.querySelector(`[data-category-title="${id}"]`);if(title)title.textContent=result.category.name;status.textContent='Saved';showNotice('',false)}
    catch(error){showNotice(error.message,true)}
    finally{saveButton.disabled=false;saveButton.textContent=label}
    return;
   }
   const deleteButton=event.target.closest('[data-category-delete]');
   if(deleteButton){
    const id=Number(deleteButton.dataset.categoryDelete),category=byId[id];if(!category)return;
    if(!confirm(`Delete the "${category.name}" category? Products in it become uncategorised. This cannot be undone.`))return;
    deleteButton.disabled=true;const label=deleteButton.textContent;deleteButton.textContent='Deleting…';
    try{await api(`/api/admin/categories/${id}`,{method:'DELETE'});delete byId[id];listHost.querySelector(`[data-category-card="${id}"]`)?.remove();showNotice('',false)}
    catch(error){deleteButton.disabled=false;deleteButton.textContent=label;showNotice(error.message,true)}
   }
  });
 }catch(error){host.innerHTML=`<h1 class="h3">Categories</h1><div class="alert alert-danger mt-3" role="alert">${escapeHtml(error.message)}</div>`}
}
async function orders(){const d=await api('/api/admin/orders');document.getElementById('adminContent').innerHTML=`<h1 class="h3">Orders</h1><div class="glass p-3 mt-3 table-responsive"><table class="table"><thead><tr><th>Number</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>${(d.orders||[]).map(o=>`<tr><td>${o.trackingCode}</td><td>${o.customerName}</td><td>₦${o.total.toLocaleString('en-NG')}</td><td><select class="form-select" data-status="${o.id}"><option ${o.status==='pending'?'selected':''}>pending</option><option ${o.status==='confirmed'?'selected':''}>confirmed</option><option ${o.status==='processing'?'selected':''}>processing</option><option ${o.status==='shipped'?'selected':''}>shipped</option><option ${o.status==='delivered'?'selected':''}>delivered</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>api(`/api/admin/orders/${s.dataset.status}`,{method:'PATCH',body:JSON.stringify({status:s.value})}))}
async function messages(){const d=await api('/api/admin/messages');document.getElementById('adminContent').innerHTML=`<h1 class="h3">Customers & Messages</h1><div class="glass p-3 mt-3"><h2 class="h5">Contacts</h2>${(d.contacts||[]).map(m=>`<div class="border-bottom py-2"><strong>${m.name}</strong> — ${m.email}<p>${m.message}</p></div>`).join('')||'<p>No messages.</p>'}<h2 class="h5 mt-4">Subscribers</h2>${(d.subscribers||[]).map(s=>`<div>${s.email}</div>`).join('')||'<p>No subscribers.</p>'}</div>`}
async function settings(){const d=await api('/api/admin/settings');document.getElementById('adminContent').innerHTML=`<h1 class="h3">Settings</h1><form id="settingsForm" class="glass p-4 mt-3">${(d.settings||[]).map(s=>`<label class="form-label text-capitalize">${s.key.replaceAll('_',' ')}</label><input class="form-control mb-3" name="${s.key}" value="${String(s.value).replaceAll('"','&quot;')}">`).join('')}<button class="btn btn-glossy">Save settings</button></form>`;document.getElementById('settingsForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))})}}
const tabs={dashboard,products,categories:manageCategories,orders,messages,settings};document.querySelectorAll('[data-tab]').forEach(a=>a.onclick=e=>{e.preventDefault();closeProductModal();tabs[a.dataset.tab]()});document.getElementById('logout').onclick=async e=>{e.preventDefault();await api('/api/auth/logout',{method:'POST'}).catch(()=>{});location.reload()};
init();
</script>
