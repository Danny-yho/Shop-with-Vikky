name: Keep Render API warm

# Keeps the free Render instance awake during peak shopping hours.
# 07:00-21:59 UTC == 08:00-22:59 WAT (West Africa Time, UTC+1).
on:
  schedule:
    # Every 14 minutes between 07:00 and 21:59 UTC.
    - cron: '*/14 7-21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Render instance
    runs-on: ubuntu-latest
    steps:
      - name: Warm up root and health endpoint
        run: |
          for path in "/" "/health"; do
            url="https://shop-with-vikky-api.onrender.com${path}"
            if curl -fsS -m 45 -o /dev/null "$url"; then
              echo "OK   $url"
            else
              echo "WARN $url did not return a success status (instance may be cold-starting); will retry next run."
            fi
          done
